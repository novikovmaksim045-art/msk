<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>РИА QR Проверка</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef3f8;color:#172033}.top{background:linear-gradient(135deg,#173b69,#1e5aa8);color:white;padding:24px 18px}.brand{max-width:680px;margin:auto}.mark{width:54px;height:54px;border-radius:14px;background:white;color:#173b69;display:grid;place-items:center;font-weight:900;font-size:22px;margin-bottom:12px}.brand b{font-size:20px}.brand small{display:block;opacity:.85;margin-top:5px}.wrap{max-width:680px;margin:auto;padding:18px}.card{background:white;border-radius:18px;padding:20px;box-shadow:0 8px 28px #173b6918}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:13px;padding:15px 10px;font-size:16px;font-weight:700}.primary{background:#1e5aa8;color:white}.secondary{background:#e8f0fa;color:#173b69}.status{margin-top:18px;border-radius:14px;padding:15px;font-weight:900;text-align:center}.idle{background:#f3f5f7;color:#657080}.valid{background:#e7f7ed;color:#137333}.invalid{background:#fdecec;color:#b42318}.fields{display:none;gap:10px;margin-top:14px}.field{padding:13px;border:1px solid #e4e9ef;border-radius:12px}.field label{display:block;color:#6b7685;font-size:12px;margin-bottom:5px}.open{display:none;width:100%;margin-top:14px;background:#137333;color:white}h2{margin-top:0}.note{font-size:13px;color:#6b7685;line-height:1.45;margin-top:14px}@media(max-width:480px){.actions{grid-template-columns:1fr}}
</style></head><body><header class="top"><div class="brand"><div class="mark">РИА</div><b>Российская инженерная академия</b><small>Секция «Строительство» — проверка подлинности QR</small></div></header><main class="wrap"><section class="card"><h2>Проверка QR-кода</h2><div class="actions"><button id="scanBtn" class="btn primary">Сканировать камерой</button><button id="fileBtn" class="btn secondary">Выбрать изображение</button></div><div id="status" class="status idle">Готово к проверке</div><div id="fields" class="fields"></div><button id="openBtn" class="btn open">Открыть запись в реестре</button><div class="note">Подлинность проверяется по цифровой подписи РИА. Для самой проверки подключение к реестру не требуется.</div></section></main><script src="app.js"></script></body></html>
