name: Build RIA QR Android APK
on:
  push:
    branches: [ ria-qr-android ]
    paths: [ 'ria-qr-android/**' ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ria-qr-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build installable APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: RIA_QR_Android_v1.0_APK
          path: ria-qr-android/app/build/outputs/apk/debug/app-debug.apk
